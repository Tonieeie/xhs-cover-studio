<!doctype html>
<!--
================================================================================
  WeUp · 小红书封面模板（多变体 / Variants）— 黄黑风格
  AI INSTRUCTIONS — READ THIS BLOCK BEFORE EDITING
================================================================================

  PURPOSE:
    One file, four interchangeable WeUp layouts. All share the brand palette
    (yellow #FFC524 + near-black #1A1610 + coral #FF6F61) and the rule that the
    user's photo is drawn cover-fit (NEVER squashed) and naturally masked by the
    brand shapes. 1200×1600 (3:4) PNG.

  THE TWO KNOBS YOU MAY TOUCH:
    - LAYOUT    : which variant to render. One of:
                  'wave'        top yellow third + wavy divider (default)
                  'slant'       bold diagonal yellow top + dark slant footer
                  'arch'        photo inside a rounded arch window
                  'bottomwave'  photo hero on top + yellow wave caption band
    - PHOTO_SRC : the user's image. Save it to assets/photo.jpg and point here.

  Everything else (colours, geometry, logo placement) is locked. The yellow
  zones are intentionally left empty for the user's own headline text.

  EXPORT: open in a browser, screenshot the #cover canvas at native 1200×1600.
================================================================================
-->
<html lang="zh">
<head>
<meta charset="utf-8">
<title>WeUp · Cover Variants</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px}
  #cover{box-shadow:0 40px 80px -30px rgba(0,0,0,.6);transform:scale(min(calc((100vw - 80px)/1200),calc((100vh - 80px)/1600)));transform-origin:center}
</style>
</head>
<body>

<canvas id="cover" width="1200" height="1600"></canvas>

<script>
/* ============================================================
   THE ONLY TWO KNOBS — AI: change these, nothing else.
   ============================================================ */
const LAYOUT = 'wave';                  // 'wave' | 'slant' | 'arch' | 'bottomwave'
const PHOTO_SRC = 'assets/photo.jpg';

/* ---------- locked brand tokens ---------- */
const W = 1200, H = 1600, B = 22;
const YELLOW = '#FFC524', DARK = '#1A1610', CORAL = '#FF6F61';
const LOGO_URL = 'assets/logo.png';

/* ---------- helpers ---------- */
function loadImage(s){return new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=s;});}
function drawCover(c,img,dx,dy,dw,dh){const ir=img.naturalWidth/img.naturalHeight,tr=dw/dh;let sx,sy,sw,sh;if(ir>tr){sh=img.naturalHeight;sw=sh*tr;sx=(img.naturalWidth-sw)/2;sy=0;}else{sw=img.naturalWidth;sh=sw/tr;sx=0;sy=(img.naturalHeight-sh)/2;}c.drawImage(img,sx,sy,sw,sh,dx,dy,dw,dh);}
function drawContain(c,img,dx,dy,dw,dh){const ir=img.naturalWidth/img.naturalHeight,tr=dw/dh;let w,h;if(ir>tr){w=dw;h=dw/ir;}else{h=dh;w=dh*ir;}c.drawImage(img,dx+(dw-w)/2,dy+(dh-h)/2,w,h);}
function wavePts(x0,x1,b,a,cy,ph){const p=[],s=140;for(let i=0;i<=s;i++){const t=i/s;p.push([x0+(x1-x0)*t,b+Math.sin(t*Math.PI*2*cy+ph)*a]);}return p;}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}

/* ---------- variant: wave ---------- */
async function wave(ctx,photo,logo){
  ctx.fillStyle=YELLOW;ctx.fillRect(0,0,W,H);
  drawCover(ctx,photo,B,B,W-2*B,H-2*B);
  const tb=H*0.355,top=wavePts(0,W,tb,48,1.5,0.6);
  ctx.beginPath();ctx.moveTo(0,0);for(const[x,y]of top)ctx.lineTo(x,y);ctx.lineTo(W,0);ctx.closePath();ctx.fillStyle=YELLOW;ctx.fill();
  ctx.beginPath();ctx.moveTo(top[0][0],top[0][1]);for(let i=1;i<top.length;i++)ctx.lineTo(top[i][0],top[i][1]);ctx.lineCap='round';ctx.strokeStyle=CORAL;ctx.lineWidth=12;ctx.stroke();
  const bb=H-176,bot=wavePts(B,W-B,bb,34,1.5,3.5);
  ctx.beginPath();ctx.moveTo(B,H-B);for(const[x,y]of bot)ctx.lineTo(x,y);ctx.lineTo(W-B,H-B);ctx.closePath();ctx.fillStyle=DARK;ctx.fill();
  ctx.beginPath();ctx.moveTo(bot[0][0],bot[0][1]);for(let i=1;i<bot.length;i++)ctx.lineTo(bot[i][0],bot[i][1]);ctx.strokeStyle=YELLOW;ctx.lineWidth=4;ctx.stroke();
  ctx.beginPath();ctx.arc(W-B-70,(bb+(H-B))/2+17,11,0,Math.PI*2);ctx.fillStyle=CORAL;ctx.fill();
  drawContain(ctx,logo,B+34,B+24,248,248);
}

/* ---------- variant: slant ---------- */
async function slant(ctx,photo,logo){
  ctx.fillStyle=YELLOW;ctx.fillRect(0,0,W,H);
  drawCover(ctx,photo,B,B,W-2*B,H-2*B);
  const tlY=H*0.37,trY=H*0.27;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,0);ctx.lineTo(W,trY);ctx.lineTo(0,tlY);ctx.closePath();ctx.fillStyle=YELLOW;ctx.fill();
  ctx.beginPath();ctx.moveTo(0,tlY);ctx.lineTo(W,trY);ctx.lineCap='round';ctx.strokeStyle=CORAL;ctx.lineWidth=14;ctx.stroke();
  const blY=H-150,brY=H-240;
  ctx.beginPath();ctx.moveTo(B,H-B);ctx.lineTo(W-B,H-B);ctx.lineTo(W-B,brY);ctx.lineTo(B,blY);ctx.closePath();ctx.fillStyle=DARK;ctx.fill();
  ctx.beginPath();ctx.moveTo(B,blY);ctx.lineTo(W-B,brY);ctx.strokeStyle=YELLOW;ctx.lineWidth=4;ctx.stroke();
  ctx.beginPath();ctx.arc(W-B-70,(brY+H-B)/2+20,11,0,Math.PI*2);ctx.fillStyle=CORAL;ctx.fill();
  drawContain(ctx,logo,B+34,B+24,248,248);
}

/* ---------- variant: arch ---------- */
async function arch(ctx,photo,logo){
  ctx.fillStyle=YELLOW;ctx.fillRect(0,0,W,H);
  const m=92,wt=360,wb=H-176,wx=m,ww=W-2*m,wh=wb-wt,r=[ww/2,ww/2,46,46];
  ctx.save();rr(ctx,wx,wt,ww,wh,r);ctx.clip();drawCover(ctx,photo,wx,wt,ww,wh);ctx.restore();
  rr(ctx,wx,wt,ww,wh,r);ctx.lineWidth=11;ctx.strokeStyle=DARK;ctx.stroke();
  rr(ctx,wx+13,wt+13,ww-26,wh-26,[ww/2-13,ww/2-13,34,34]);ctx.lineWidth=3;ctx.strokeStyle=CORAL;ctx.stroke();
  ctx.beginPath();ctx.arc(W/2,H-92,12,0,Math.PI*2);ctx.fillStyle=CORAL;ctx.fill();
  drawContain(ctx,logo,44,40,236,236);
}

/* ---------- variant: bottomwave ---------- */
async function bottomwave(ctx,photo,logo){
  ctx.fillStyle=YELLOW;ctx.fillRect(0,0,W,H);
  drawCover(ctx,photo,B,B,W-2*B,H-2*B);
  const baseY=H*0.66,top=wavePts(0,W,baseY,52,1.5,0.6);
  ctx.beginPath();ctx.moveTo(0,H);for(const[x,y]of top)ctx.lineTo(x,y);ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=YELLOW;ctx.fill();
  ctx.beginPath();ctx.moveTo(top[0][0],top[0][1]);for(let i=1;i<top.length;i++)ctx.lineTo(top[i][0],top[i][1]);ctx.lineCap='round';ctx.strokeStyle=CORAL;ctx.lineWidth=12;ctx.stroke();
  const fY=H-118;ctx.fillStyle=DARK;ctx.fillRect(B,fY,W-2*B,H-B-fY);ctx.fillStyle=YELLOW;ctx.fillRect(B,fY,W-2*B,4);
  ctx.beginPath();ctx.arc(W-B-66,fY+(H-B-fY)/2,11,0,Math.PI*2);ctx.fillStyle=CORAL;ctx.fill();
  drawContain(ctx,logo,B+40,baseY+40,236,236);
}

const VARIANTS={wave,slant,arch,bottomwave};

(async()=>{
  const ctx=document.getElementById('cover').getContext('2d');
  const photo=await loadImage(PHOTO_SRC);
  const logo=await loadImage(LOGO_URL);
  await (VARIANTS[LAYOUT]||wave)(ctx,photo,logo);
})();
</script>

</body>
</html>
